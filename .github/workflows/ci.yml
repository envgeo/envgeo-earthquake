name: EnvGeo-Earthquake CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: >-
          python -c "import ast, pathlib;
          files=[pathlib.Path('home.py'), pathlib.Path('envgeo_utils.py'),
          *pathlib.Path('pages').glob('*.py'), *pathlib.Path('test').glob('*.py')];
          [ast.parse(path.read_text(encoding='utf-8'), filename=str(path)) for path in files];
          print(f'parsed {len(files)} files')"

      - name: Check public-release contents
        run: python -m pytest -q -p no:cacheprovider test/test_repository_health.py

      - name: Run network-independent test suite
        run: python -m pytest -q -p no:cacheprovider test
